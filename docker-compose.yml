version: "3.9"

services:
  bot:
    build: .
    container_name: logoped_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./media:/app/media
      - ./articles:/app/articles
