<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — Татьяна Шумилова</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFAF7;
    --blush-050:#FDF3F0;
    --blush-100:#FBEAE5;
    --blush-200:#F4D6CD;
    --rose-400:#D8998F;
    --rose-500:#C67F73;
    --rose-600:#B06559;
    --ink:#3B2A26;
    --ink-soft:#6E5952;
    --muted:#9C8983;
    --line:#EFDDD6;
    --gold:#C7A369;
    --green:#7C9B72;
    --white:#FFFFFF;
    --shadow: 0 12px 32px -12px rgba(94,54,44,0.22);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',sans-serif;
    background:#EDE0DA;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 10px 40px;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces', serif; }

  /* ---------- MODE SWITCH (prototype-only control) ---------- */
  #devSwitch{
    position:fixed; top:12px; right:12px; z-index:999;
    display:flex; background:rgba(59,42,38,0.85); border-radius:999px; padding:3px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    font-size:11.5px; font-weight:700;
  }
  #devSwitch button{
    border:none; background:transparent; color:#EAD9D2; padding:7px 12px; border-radius:999px;
    cursor:pointer; font-family:'Manrope',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.2px;
  }
  #devSwitch button.active{ background:var(--rose-500); color:#fff; }

  /* ================= CLIENT PHONE FRAME ================= */
  #clientFrame{
    width:400px; max-width:100%;
    background:var(--cream);
    border-radius:38px;
    box-shadow: var(--shadow), 0 0 0 8px #201512;
    overflow:hidden;
    position:relative;
    min-height:812px;
    display:flex;
    flex-direction:column;
  }
  #clientNotch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:150px; height:24px; background:#201512; border-radius:0 0 16px 16px; z-index:50;
  }
  #clientScroll{
    flex:1; overflow-y:auto; padding-bottom:90px; padding-top:18px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  #clientScroll::-webkit-scrollbar{display:none;}
  .px{ padding-left:20px; padding-right:20px; }

  /* Bottom nav */
  #bottomNav{
    position:absolute; bottom:0; left:0; right:0; height:78px;
    background:rgba(255,250,247,0.96); backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around;
    padding-bottom:10px; z-index:40;
  }
  .navItem{ display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; color:var(--muted); flex:1; }
  .navItem svg{ width:22px; height:22px; }
  .navItem span{ font-size:10.5px; font-weight:700; }
  .navItem.active{ color:var(--rose-600); }

  /* Top bar within screens */
  .screenTitle{ font-size:22px; font-weight:600; margin:0 0 4px; }
  .screenSub{ font-size:13px; color:var(--muted); margin:0 0 18px; line-height:1.5;}
  .backRow{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .backBtn{ width:34px; height:34px; border-radius:50%; background:var(--blush-100); display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; }
  .backBtn svg{ width:16px; height:16px; }

  /* Cards */
  .card{ background:var(--white); border-radius:var(--radius-md); padding:16px; box-shadow:0 6px 18px -10px rgba(94,54,44,0.18); }
  .hero-card{
    position:relative; border-radius:var(--radius-lg); overflow:hidden; color:#fff;
    background: linear-gradient(180deg, rgba(59,42,38,0.05) 0%, rgba(40,26,22,0.78) 78%), var(--rose-400);
    min-height:230px; display:flex; flex-direction:column; justify-content:flex-end; padding:20px;
  }
  .hero-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; z-index:0; }
  .hero-card .heroContent{ position:relative; z-index:2; }
  .hero-eyebrow{ font-size:12px; opacity:.85; margin:0 0 2px; font-weight:600;}
  .hero-name{ font-size:24px; margin:0 0 2px; font-weight:600; }
  .hero-role{ font-size:13px; opacity:.9; margin:0; }

  .badgeRow{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .badge{ background:var(--blush-100); color:var(--rose-600); font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:999px; display:flex; align-items:center; gap:5px;}
  .badge svg{width:13px;height:13px;}

  .btn{
    border:none; border-radius:16px; padding:15px 18px; font-family:'Manrope',sans-serif;
    font-weight:700; font-size:14.5px; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg, var(--rose-500), var(--rose-600)); color:#fff; box-shadow:0 10px 22px -10px rgba(176,101,89,0.7); }
  .btn-secondary{ background:var(--blush-100); color:var(--rose-600); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }
  .btn-sm{ padding:9px 14px; font-size:12.5px; border-radius:12px; width:auto; }
  .stack{ display:flex; flex-direction:column; gap:10px; }

  .sectionLabel{ font-size:12.5px; font-weight:800; color:var(--muted); text-transform:none; margin:22px 0 10px; }

  .howRow{ display:flex; gap:10px; margin-top:6px; }
  .howItem{ flex:1; background:var(--blush-050); border-radius:16px; padding:14px 8px; text-align:center; }
  .howItem .ic{ width:32px; height:32px; border-radius:50%; background:var(--blush-200); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; }
  .howItem svg{ width:16px; height:16px; color:var(--rose-600); }
  .howItem span{ font-size:11px; font-weight:700; color:var(--ink-soft); line-height:1.3; display:block; }

  /* Country list */
  .searchBox{ background:var(--blush-050); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .searchBox input{ border:none; background:transparent; outline:none; font-size:14px; width:100%; font-family:'Manrope',sans-serif; color:var(--ink); }
  .searchBox svg{ width:16px; height:16px; color:var(--muted); flex-shrink:0; }
  .countryRow{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .countryRow:last-child{ border-bottom:none; }
  .flag{ font-size:22px; width:30px; text-align:center; }
  .countryName{ font-weight:700; font-size:14px; }
  .countryTz{ font-size:12px; color:var(--muted); }
  .radio{ width:20px; height:20px; border-radius:50%; border:2px solid var(--line); margin-left:auto; flex-shrink:0; position:relative; }
  .radio.checked{ border-color:var(--rose-500); }
  .radio.checked::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--rose-500); }
  .tzNote{ margin-top:16px; background:var(--blush-050); border-radius:14px; padding:12px 14px; font-size:12.5px; color:var(--ink-soft); display:flex; gap:8px; align-items:flex-start; }
  .tzNote svg{ width:15px; height:15px; color:var(--rose-500); flex-shrink:0; margin-top:1px;}

  /* Calendar */
  .calHead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .calHead button{ background:var(--blush-100); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .calHead button svg{ width:14px; height:14px; }
  .calMonth{ font-weight:700; font-size:14.5px; }
  .calGrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .calDow{ font-size:10.5px; color:var(--muted); font-weight:700; padding-bottom:6px; }
  .calDay{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; position:relative; color:var(--ink-soft); }
  .calDay.empty{ cursor:default; }
  .calDay.hasFree:not(.disabled){ color:var(--ink); }
  .calDay.disabled{ color:#D8CAC4; cursor:not-allowed; }
  .calDay.selected{ background:var(--rose-500); color:#fff !important; }
  .calDay .dot{ position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:var(--rose-400); }
  .calDay.selected .dot{ background:#fff; }
  .calDay.today:not(.selected){ box-shadow:inset 0 0 0 1.5px var(--rose-300, var(--rose-400)); }

  .slotLabel{ font-size:13px; font-weight:700; margin:18px 0 10px; }
  .slotGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .slot{ padding:11px 4px; border-radius:12px; text-align:center; font-size:13px; font-weight:700; cursor:pointer; background:var(--blush-050); color:var(--ink); border:1.5px solid transparent;}
  .slot.busy{ background:#F3EDEA; color:#C9BAB3; cursor:not-allowed; text-decoration:line-through; }
  .slot.selected{ background:var(--rose-500); color:#fff; }

  .infoBox{ background:var(--blush-050); border-radius:14px; padding:12px 14px; display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--ink-soft); margin-top:16px;}
  .infoBox svg{ width:14px; height:14px; color:var(--rose-500); flex-shrink:0; margin-top:2px;}

  /* Confirm summary */
  .sumRow{ display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .sumRow:last-child{ border-bottom:none; }
  .sumRow .l{ color:var(--muted); }
  .sumRow .r{ font-weight:700; }

  /* Success */
  .successWrap{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:30px; }
  .successCheck{ width:82px; height:82px; border-radius:50%; background:var(--blush-100); display:flex; align-items:center; justify-content:center; margin-bottom:20px; }
  .successCheck svg{ width:38px; height:38px; color:var(--rose-600); }

  /* Tabs pill */
  .pillTabs{ display:flex; background:var(--blush-050); border-radius:14px; padding:4px; margin-bottom:16px; }
  .pillTabs button{ flex:1; border:none; background:transparent; padding:10px; border-radius:11px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .pillTabs button.active{ background:#fff; color:var(--rose-600); box-shadow:0 4px 10px -4px rgba(94,54,44,0.25);}

  .histCard{ background:#fff; border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:0 4px 14px -10px rgba(94,54,44,0.2); }
  .histTop{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .histDate{ font-weight:700; font-size:13.5px; }
  .histTime{ font-size:12px; color:var(--muted); }
  .statusTag{ font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; }
  .statusTag.confirmed{ background:#E9F1E6; color:var(--green); }
  .statusTag.done{ background:var(--blush-100); color:var(--rose-600); }
  .statusTag.cancelled{ background:#F3EDEA; color:#B3A29B; }
  .histTopic{ font-size:12.5px; color:var(--ink-soft); }

  .matCard{ background:#fff; border-radius:16px; padding:12px; margin-bottom:10px; display:flex; gap:12px; align-items:center; box-shadow:0 4px 14px -10px rgba(94,54,44,0.2);}
  .matIcon{ width:46px; height:46px; border-radius:12px; background:var(--blush-100); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .matIcon svg{ width:22px; height:22px; color:var(--rose-600); }
  .matTitle{ font-size:13.5px; font-weight:700; margin:0 0 2px; }
  .matMeta{ font-size:11.5px; color:var(--muted); }
  .matBtn{ width:36px; height:36px; border-radius:50%; background:var(--blush-050); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .matBtn svg{ width:16px; height:16px; color:var(--rose-600); }

  .profHead{ display:flex; flex-direction:column; align-items:center; margin-bottom:20px; }
  .avatarLg{ width:84px; height:84px; border-radius:50%; object-fit:cover; margin-bottom:10px; border:3px solid #fff; box-shadow:0 6px 16px -6px rgba(94,54,44,0.4); }
  .field{ margin-bottom:14px; }
  .field label{ font-size:11.5px; font-weight:800; color:var(--muted); display:block; margin-bottom:5px; }
  .field input, .field textarea{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; font-family:'Manrope',sans-serif; font-size:13.5px; color:var(--ink); outline:none; background:#fff; }
  .field textarea{ resize:none; min-height:64px; }
  .field input:focus, .field textarea:focus{ border-color:var(--rose-400); }

  .linkList{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 14px -10px rgba(94,54,44,0.2); }
  .linkRow{ display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .linkRow:last-child{ border-bottom:none; }
  .linkRow .ic{ width:34px; height:34px; border-radius:10px; background:var(--blush-050); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .linkRow .ic svg{ width:16px; height:16px; color:var(--rose-600); }
  .linkRow span{ font-size:13.5px; font-weight:700; flex:1; }
  .linkRow .chev{ width:14px; height:14px; color:var(--muted); }

  .statTile{ background:#fff; border-radius:14px; padding:12px; text-align:center; box-shadow:0 4px 14px -10px rgba(94,54,44,0.18);}
  .statTile b{ display:block; font-size:17px; font-family:'Fraunces',serif; font-weight:600; }
  .statTile span{ font-size:10px; color:var(--muted); font-weight:700; }
  .statGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }

  .toast{ position:fixed; bottom:110px; left:50%; transform:translateX(-50%) translateY(20px); background:#2C1E1A; color:#fff; padding:12px 20px; border-radius:14px; font-size:13px; font-weight:600; opacity:0; transition:all .25s ease; z-index:1000; pointer-events:none; max-width:320px; text-align:center;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .payRow{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line); }
  .payRow:last-child{ border-bottom:none; }
  .payIcon{ width:32px; height:32px; border-radius:8px; background:var(--blush-050); display:flex; align-items:center; justify-content:center; font-size:15px;}

  /* ================= ADMIN DASHBOARD ================= */
  #adminFrame{ width:100%; max-width:960px; }
  .adminHeader{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px;}
  .adminHeaderLeft{ display:flex; align-items:center; gap:12px; }
  .adminHeaderLeft img{ width:48px; height:48px; border-radius:50%; object-fit:cover; }
  .adminTitle{ font-size:20px; font-weight:600; margin:0; }
  .adminSub{ font-size:12.5px; color:var(--muted); margin:2px 0 0; }
  .adminTabs{ display:flex; gap:8px; background:#fff; padding:5px; border-radius:14px; box-shadow:0 4px 14px -10px rgba(94,54,44,0.2); }
  .adminTabs button{ border:none; background:transparent; padding:10px 16px; border-radius:10px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer; }
  .adminTabs button.active{ background:var(--rose-500); color:#fff; }

  .adminGrid{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  @media (max-width:760px){ .adminGrid{ grid-template-columns:1fr; } }

  .adStatRow{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:760px){ .adStatRow{ grid-template-columns:repeat(2,1fr);} }
  .adStat{ background:#fff; border-radius:16px; padding:16px; box-shadow:0 6px 18px -12px rgba(94,54,44,0.25);}
  .adStat .val{ font-size:22px; font-family:'Fraunces',serif; font-weight:600; }
  .adStat .lab{ font-size:11.5px; color:var(--muted); font-weight:700; margin-top:2px; }
  .adStat .delta{ font-size:11px; font-weight:800; color:var(--green); margin-top:6px; display:flex; align-items:center; gap:4px;}

  .adCard{ background:#fff; border-radius:20px; padding:20px; box-shadow:0 6px 20px -14px rgba(94,54,44,0.25); margin-bottom:18px; }
  .adCard h3{ font-size:15px; margin:0 0 14px; font-weight:700; font-family:'Manrope',sans-serif; }

  .adCalGrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
  .adCalDay{ aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink-soft); position:relative; gap:2px;}
  .adCalDay.empty{ cursor:default; }
  .adCalDay.selected{ background:var(--rose-500); color:#fff; }
  .adCalDay .cnt{ font-size:9px; font-weight:800; color:var(--rose-500); }
  .adCalDay.selected .cnt{ color:#fce9e5; }
  .adCalDay.today:not(.selected){ box-shadow:inset 0 0 0 1.5px var(--rose-400); }

  .adSlotRow{ display:flex; align-items:center; justify-content:space-between; padding:11px 12px; border-radius:12px; background:var(--blush-050); margin-bottom:8px; }
  .adSlotRow.busy{ background:#F3EDEA; }
  .adSlotRow.booked{ background:#FBEAE5; border:1.5px solid var(--rose-300,var(--rose-400)); }
  .adSlotTime{ font-weight:800; font-size:13.5px; width:56px; }
  .adSlotInfo{ flex:1; font-size:12px; color:var(--ink-soft); }
  .adSlotInfo b{ display:block; font-size:12.5px; color:var(--ink); }
  .miniBtn{ border:none; border-radius:9px; padding:7px 11px; font-size:11.5px; font-weight:800; cursor:pointer; font-family:'Manrope',sans-serif; }
  .miniBtn.block{ background:#fff; color:var(--rose-600); }
  .miniBtn.unblock{ background:#fff; color:var(--green); }
  .miniBtn.cancel{ background:#fff; color:#C0574B; }

  .bookRowAd{ display:flex; align-items:center; gap:12px; padding:12px; border-radius:14px; background:var(--blush-050); margin-bottom:8px; }
  .bookRowAd .d{ width:52px; text-align:center; }
  .bookRowAd .d b{ display:block; font-size:16px; font-family:'Fraunces',serif;}
  .bookRowAd .d span{ font-size:10px; color:var(--muted); font-weight:700; }
  .bookRowAd .mid{ flex:1; }
  .bookRowAd .mid b{ font-size:13px; display:block; }
  .bookRowAd .mid span{ font-size:11.5px; color:var(--muted); }

  .incRow{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .incRow:last-child{ border-bottom:none; }
  .incRow .l b{ display:block; font-size:13px; }
  .incRow .l span{ font-size:11.5px; color:var(--muted); }
  .incRow .amt{ font-weight:800; font-size:14px; color:var(--green); }
  .incRow .amt.neg{ color:#C0574B; }
  .incActions{ display:flex; gap:6px; margin-left:10px; }
  .iconBtn{ width:26px; height:26px; border-radius:8px; border:none; background:var(--blush-100); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .iconBtn svg{ width:12px; height:12px; color:var(--rose-600); }

  .formRow{ display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:end; }
  @media (max-width:760px){ .formRow{ grid-template-columns:1fr 1fr; } }
  .formRow .field{ margin-bottom:0; }
  .formRow input{ width:100%; border:1.5px solid var(--line); border-radius:11px; padding:10px 12px; font-family:'Manrope',sans-serif; font-size:13px; outline:none; }

  .barChart{ display:flex; align-items:flex-end; gap:8px; height:120px; margin-top:6px; }
  .barChart .bar{ flex:1; background:linear-gradient(180deg,var(--rose-400),var(--rose-600)); border-radius:6px 6px 3px 3px; position:relative; min-height:4px; }
  .barChart .col{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; gap:6px;}
  .barChart .col span{ font-size:9.5px; color:var(--muted); font-weight:700; }

  .modalBg{ position:fixed; inset:0; background:rgba(40,26,22,0.45); display:flex; align-items:center; justify-content:center; z-index:2000; padding:20px;}
  .modalCard{ background:#fff; border-radius:20px; padding:22px; width:100%; max-width:340px; }
  .modalCard h3{ margin:0 0 14px; font-size:16px; }
  .hidden{ display:none !important; }

  ::selection{ background:var(--blush-200); }
</style>
<style>
  body{ background:#EDE0DA; align-items:flex-start; padding:20px 14px 60px; }
  #adminFrame{ width:100%; max-width:960px; margin:0 auto; }
  .authBanner{ background:#F3EDEA; color:#8B6F6A; font-size:12px; text-align:center; padding:10px; border-radius:12px; margin-bottom:14px; }
</style>
</head>

<div id="adminFrame">

function pad(n){ return n<10?'0'+n:''+n; }
function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const wd = ['вс','пн','вт','ср','чт','пт','сб'][dt.getDay()];
  return d+' '+months[m-1]+', '+wd;
}
const monthsShort = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const today = new Date(); today.setHours(0,0,0,0);

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

        <button data-t="calendar" class="${adminTab==='calendar'?'active':''}">Календарь</button>
        <button data-t="bookings" class="${adminTab==='bookings'?'active':''}">Записи</button>
        <button data-t="income" class="${adminTab==='income'?'active':''}">Доход</button>
      </div>
    </div>
    <div id="tabBody">${inner}</div>
  `;
  body.querySelectorAll('.adminTabs button').forEach(b=>b.addEventListener('click', ()=>{ adminTab=b.dataset.t; renderAdmin(); }));
}

async function renderAdmin(){
  shell(`<p style="text-align:center;color:var(--muted);margin-top:40px;">Загрузка...</p>`);
  try {
    if(adminTab==='dashboard') await renderDashboard();
    else if(adminTab==='calendar') await renderCalendar();
    else if(adminTab==='bookings') await renderBookings();
    else if(adminTab==='income') await renderIncome();
  } catch(e){
    if(e.status===403){ document.getElementById('deniedBox').classList.remove('hidden'); document.getElementById('adminBody').classList.add('hidden'); }
    else { document.getElementById('tabBody').innerHTML = `<p style="color:var(--muted);text-align:center;margin-top:40px;">Ошибка загрузки данных</p>`; }
  }
}

function clientLabel(b){
  if(b.client_username) return '@'+b.client_username;
  if(b.client_name) return b.client_name;
  if(b.client_telegram_id) return 'ID '+b.client_telegram_id;
  return 'Клиент';
}
function bookRowHTML(b){
  const [y,m,d] = b.date.split('-');
  return `
    <div class="bookRowAd">
      <div class="d"><b>${Number(d)}</b><span>${monthsShort[Number(m)-1]}</span></div>
      <div class="mid"><b>${b.time} · ${clientLabel(b)}</b><span>${b.topic||'Занятие'} · ${b.country||''} ${b.timezone||''}</span></div>
      <span class="statusTag ${b.status==='confirmed'?'confirmed':(b.status==='done'?'done':'cancelled')}">${b.status==='confirmed'?'Подтверждено':(b.status==='done'?'Завершено':'Отменено')}</span>
    </div>`;
}

async function renderDashboard(){
  const [slotsResp, bookings, income] = await Promise.all([
    api(`/api/admin/slots?year=${today.getFullYear()}&month=${today.getMonth()+1}`),
    api('/api/admin/bookings'),
    api('/api/admin/income'),
  ]);
  const upcoming = bookings.filter(b=>b.status==='confirmed').sort((a,b)=>a.date.localeCompare(b.date));
  const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate()+7);
  const weekBookings = upcoming.filter(b=>b.date>=dkey(today) && b.date<=dkey(weekEnd));
  const next = upcoming[0];

  function monthIncome(offset){
    const d = new Date(today.getFullYear(), today.getMonth()+offset, 1);
    return income.filter(i=>{ const [y,m]=i.date.split('-').map(Number); return y===d.getFullYear() && (m-1)===d.getMonth(); }).reduce((s,i)=>s+i.amount,0);
  }
  const thisMonth = monthIncome(0), lastMonth = monthIncome(-1);
  const delta = lastMonth? Math.round((thisMonth-lastMonth)/lastMonth*100) : 0;
  const allTime = income.reduce((s,i)=>s+i.amount,0);

  const vals = [];
  for(let i=5;i>=0;i--){ vals.push({label: monthsShort[new Date(today.getFullYear(),today.getMonth()-i,1).getMonth()], val: monthIncome(-i)}); }
  const max = Math.max(...vals.map(v=>v.val),1);
  const chart = `<div class="barChart">${vals.map(v=>`<div class="col"><div class="bar" style="height:${Math.max(4,v.val/max*100)}%;" title="${v.val} ₽"></div><span>${v.label}</span></div>`).join('')}</div>`;

  document.getElementById('tabBody').innerHTML = `
    <div class="adStatRow">
      <div class="adStat"><div class="val">${thisMonth.toLocaleString('ru-RU')} ₽</div><div class="lab">Доход за месяц</div>${lastMonth? `<div class="delta">${ICONS.up} ${delta>=0?'+':''}${delta}% к прошлому</div>`:''}</div>
      <div class="adStat"><div class="val">${weekBookings.length}</div><div class="lab">Записей на неделе</div></div>
      <div class="adStat"><div class="val">${next? next.time : '—'}</div><div class="lab">${next? fmtDate(next.date) : 'Нет ближайших занятий'}</div></div>
      <div class="adStat"><div class="val">${allTime.toLocaleString('ru-RU')} ₽</div><div class="lab">Доход всего</div></div>
    </div>
    <div class="adminGrid">
      <div class="adCard"><h3>Записи на ближайшие дни</h3>${upcoming.slice(0,6).map(bookRowHTML).join('') || '<p style="color:var(--muted);font-size:13px;">Пока нет записей</p>'}</div>
      <div class="adCard"><h3>Доход по месяцам</h3>${chart}</div>
    </div>`;
}

async function renderCalendar(){
  const base = new Date(today.getFullYear(), today.getMonth()+adminCalOffset, 1);
  const slotsResp = await api(`/api/admin/slots?year=${base.getFullYear()}&month=${base.getMonth()+1}`);
  const firstDow = (base.getDay()+6)%7;
  const daysInMonth = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="adCalDay empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(base.getFullYear(), base.getMonth(), d);
    const key = dkey(dt);
    const dayHours = slotsResp.days[key] || {};
    const bookedCount = Object.values(dayHours).filter(v=>v==='booked').length;
    const isSel = adminSelectedDate===key;
    const isToday = dkey(today)===key;
    cells += `<div class="adCalDay ${isSel?'selected':''} ${isToday?'today':''}" data-key="${key}">${d}${bookedCount? `<span class="cnt">${bookedCount}●</span>`:''}</div>`;
  }
  const dayHours = slotsResp.days[adminSelectedDate] || {};
  const daySlots = slotsResp.hours.map(h=>{
    const st = dayHours[h] || 'free';
    if(st==='free') return `<div class="adSlotRow"><div class="adSlotTime">${h}</div><div class="adSlotInfo">Свободно</div><button class="miniBtn block" data-act="block" data-h="${h}">${ICONS.lock} Занять</button></div>`;
    if(st==='blocked') return `<div class="adSlotRow busy"><div class="adSlotTime">${h}</div><div class="adSlotInfo">Занято вами (личное время)</div><button class="miniBtn unblock" data-act="unblock" data-h="${h}">Освободить</button></div>`;
    const b = (slotsResp.bookings||{})[adminSelectedDate+','+h];
    return `<div class="adSlotRow booked"><div class="adSlotTime">${h}</div><div class="adSlotInfo"><b>${b? clientLabel(b) : 'Клиент'}</b>${b? `${b.topic||'Занятие'} · ${b.country||''} ${b.timezone||''}`:''}</div><button class="miniBtn cancel" data-act="cancel" data-h="${h}" data-id="${b?b.id:''}">Отменить</button></div>`;
  }).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="adminGrid">
      <div class="adCard">
        <div class="calHead">
          <button id="calPrev">${ICONS.back}</button>
          <div class="calMonth">${monthNames[base.getMonth()]} ${base.getFullYear()}</div>
          <button id="calNext" style="transform:rotate(180deg)">${ICONS.back}</button>
        </div>
        <div class="adCalGrid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="calDow">${d}</div>`).join('')}${cells}</div>
      </div>
      <div class="adCard"><h3>Слоты на ${fmtDate(adminSelectedDate)}</h3>${daySlots}</div>
    </div>`;
  document.getElementById('calPrev').addEventListener('click', ()=>{ adminCalOffset--; renderAdmin(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ adminCalOffset++; renderAdmin(); });
  document.querySelectorAll('.adCalDay[data-key]').forEach(el=>el.addEventListener('click', ()=>{ adminSelectedDate = el.dataset.key; renderAdmin(); }));
  document.querySelectorAll('.miniBtn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const h = btn.dataset.h, act = btn.dataset.act;
      try {
        if(act==='block'){ await api('/api/admin/slots/block', {method:'POST', body: JSON.stringify({date:adminSelectedDate, time:h})}); toast('Слот отмечен как занятый'); }
        if(act==='unblock'){ await api('/api/admin/slots/unblock', {method:'POST', body: JSON.stringify({date:adminSelectedDate, time:h})}); toast('Слот снова свободен'); }
        if(act==='cancel'){ await api(`/api/admin/bookings/${btn.dataset.id}/cancel`, {method:'POST'}); toast('Запись отменена, слот освобождён'); }
        renderAdmin();
      } catch(e){ toast('Не удалось выполнить действие'); }
    });
  });
}

async function renderBookings(){
  const list = (await api('/api/admin/bookings')).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('tabBody').innerHTML = `<div class="adCard"><h3>Все записи</h3>${list.map(bookRowHTML).join('') || '<p style="color:var(--muted);font-size:13px;">Пока нет записей</p>'}</div>`;
}

async function renderIncome(){
  const income = await api('/api/admin/income');
  function monthIncome(offset){
    const d = new Date(today.getFullYear(), today.getMonth()+offset, 1);
    return income.filter(i=>{ const [y,m]=i.date.split('-').map(Number); return y===d.getFullYear() && (m-1)===d.getMonth(); }).reduce((s,i)=>s+i.amount,0);
  }
  const allTime = income.reduce((s,i)=>s+i.amount,0);
  const list = income.slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('tabBody').innerHTML = `
    <div class="adStatRow" style="grid-template-columns:repeat(2,1fr);">
      <div class="adStat"><div class="val">${monthIncome(0).toLocaleString('ru-RU')} ₽</div><div class="lab">За этот месяц</div></div>
      <div class="adStat"><div class="val">${allTime.toLocaleString('ru-RU')} ₽</div><div class="lab">За всё время</div></div>
    </div>
    <div class="adCard">
      <h3>Добавить запись о доходе</h3>
      <div class="formRow">
        <div class="field"><label>Дата</label><input type="date" id="inc_date" value="${dkey(today)}"></div>
        <div class="field"><label>Сумма, ₽</label><input type="number" id="inc_amount" placeholder="2500"></div>
        <div class="field"><label>Комментарий</label><input type="text" id="inc_note" placeholder="Например, доп. занятие"></div>
        <button class="btn btn-primary btn-sm" id="inc_add">Добавить</button>
      </div>
    </div>
    <div class="adCard">
      <h3>История дохода</h3>
      ${list.map(i=>`
        <div class="incRow">
          <div class="l"><b>${i.note||'Доход'}</b><span>${fmtDate(i.date)} · ${i.source==='booking'?'из записи':'вручную'}</span></div>
          <div style="display:flex;align-items:center;">
            <div class="amt">+${i.amount.toLocaleString('ru-RU')} ₽</div>
            <div class="incActions">
              <button class="iconBtn" data-act="edit" data-id="${i.id}" data-amount="${i.amount}">${ICONS.edit}</button>
              <button class="iconBtn" data-act="del" data-id="${i.id}">${ICONS.trash}</button>
            </div>
          </div>
        </div>`).join('') || '<p style="color:var(--muted);font-size:13px;">Пока нет записей о доходе</p>'}
    </div>`;
  document.getElementById('inc_add').addEventListener('click', async ()=>{
    const date = document.getElementById('inc_date').value;
    const amount = Number(document.getElementById('inc_amount').value);
    const note = document.getElementById('inc_note').value || 'Доход';
    if(!amount){ toast('Укажите сумму'); return; }
    try { await api('/api/admin/income', {method:'POST', body: JSON.stringify({date, amount, note})}); toast('Доход добавлен'); renderAdmin(); }
    catch(e){ toast('Не удалось добавить'); }
  });
  document.querySelectorAll('.iconBtn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      if(btn.dataset.act==='del'){
        try { await api(`/api/admin/income/${id}`, {method:'DELETE'}); toast('Запись удалена'); renderAdmin(); } catch(e){ toast('Не удалось удалить'); }
      }
      if(btn.dataset.act==='edit'){
        const val = prompt('Новая сумма, ₽:', btn.dataset.amount);
        if(val!==null && !isNaN(Number(val))){
          try { await api(`/api/admin/income/${id}`, {method:'PATCH', body: JSON.stringify({amount:Number(val)})}); toast('Сумма скорректирована'); renderAdmin(); }
          catch(e){ toast('Не удалось сохранить'); }
        }
      }
    });
  });
}

renderAdmin();
</script>
</body>
</html>
